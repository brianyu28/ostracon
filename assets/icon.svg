<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    Ostraca app icon: the source of truth for every icon size and format.
    Three clay shards (ostraka) piled on a cream ground, darkest on top.
    Full-bleed square (no rounded corners): platforms that mask icons (iOS, Android) need it
    this way. The first <rect> is the background; everything after it is the mark, which the
    maskable icons shrink into Android's safe zone. Keep `components/AppLogo` in step, then run
    `pnpm gen:icons` to regenerate public/ icons.
  -->
  <rect width="512" height="512" fill="#f3ebe0" />
  <path d="M103 116 L415 105 L426 141 L408 192 L99 205 L90 151 Z" fill="#a94f2a" />
  <path d="M111 217 L238 210 L257 224 L429 217 L416 298 L289 303 L270 291 L117 298 Z" fill="#c4643a" />
  <path d="M100 312 L436 326 L419 404 L76 390 Z" fill="#dc8a62" />
</svg>
